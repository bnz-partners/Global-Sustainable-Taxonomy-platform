# ─────────────────────────────────────────────────────────────
#  자동 조립 (build.py) — Global Sustainable Taxonomies
#
#  하는 일:
#    소스 파일(*.template.html / styles.css / *.js / build.py)을
#    고쳐서 GitHub에 올리면, GitHub이 자동으로 build.py를 실행해
#    완성된 *.html 을 다시 만들어 커밋해 줍니다.
#    → 내 컴퓨터에 파이썬을 설치할 필요가 없습니다.
#
#  ⚠️ 규칙: *.html 은 직접 고치지 마세요. 조립 결과물이라 덮어써집니다.
#     항상 *.template.html / styles.css / *.js 쪽을 고치세요.
#     템플릿이 라이브 HTML보다 낡으면 기능이 통째로 사라질 수 있는데,
#     아래 '안전 점검' 단계가 그걸 감지해 커밋을 중단시킵니다.
# ─────────────────────────────────────────────────────────────

name: Build site (auto)

on:
  push:
    paths:
      - 'global-sustainable-taxonomies-platform-v4/*.template.html'
      - 'global-sustainable-taxonomies-platform-v4/styles.css'
      - 'global-sustainable-taxonomies-platform-v4/*.js'
      - 'global-sustainable-taxonomies-platform-v4/build.py'
  workflow_dispatch:        # Actions 탭에서 손으로 실행할 수도 있게

permissions:
  contents: write           # 결과물을 다시 커밋하려면 필요

concurrency:                # 연속으로 밀어넣어도 마지막 것만 처리
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: build.py 실행
        working-directory: global-sustainable-taxonomies-platform-v4
        run: python build.py

      # ── 안전 점검 ────────────────────────────────────────────
      # 실수로 낡은 템플릿을 올렸을 때, 중요한 섹션이 통째로
      # 사라진 채 배포되는 것을 막습니다.
      # 새 기능을 만들면 아래 목록에 표식을 한 줄 추가하세요.
      - name: 안전 점검 (핵심 섹션이 살아있는지)
        working-directory: global-sustainable-taxonomies-platform-v4
        run: |
          fail=0
          check () {   # check <파일> <반드시_있어야_할_문자열> <설명>
            if grep -q -F -- "$2" "$1"; then
              echo "  OK   $1 — $3"
            else
              echo "  FAIL $1 — $3 (가 사라졌습니다)"
              fail=1
            fi
          }
          echo "핵심 섹션 점검:"
          check index.html     'id="advancedFilterToggle"' '고급 검색·필터 섹션'
          check index.html     'id="filteredSection"'      '필터 결과 목록'
          check index.html     'id="map"'                  '지도 컨테이너'
          check index.html     'window.TAXONOMY_DATA'      '국가 데이터 인라인'
          check about.html     'id="key-resources"'        'Key Reference Resources 표'
          check country.html   'id="countryContent"'       '국가 상세 본문'
          check country.html   'window.TAXONOMY_DATA'      '국가 데이터 인라인'
          check advisor.html   'id="advisorTabs"'          'AI Advisor 탭'
          check advisor.html   'window.TAXONOMY_DATA'      '국가 데이터 인라인'
          check media.html     'id="mediaGrid"'            'Media Hub 목록'
          check subscribe.html 'id="interestList"'         '구독 관심분야 목록'
          if [ "$fail" = "1" ]; then
            echo ""
            echo "::error::조립 결과에서 핵심 섹션이 사라졌습니다. 커밋을 중단합니다."
            echo "원인은 대부분 '템플릿이 실제 사이트보다 낡은 경우'입니다."
            exit 1
          fi
          echo "점검 통과."

      - name: 변경사항 커밋
        working-directory: global-sustainable-taxonomies-platform-v4
        run: |
          if [ -z "$(git status --porcelain -- '*.html')" ]; then
            echo "조립 결과가 기존과 동일합니다. 커밋할 것 없음."
            echo "### 조립 결과: 변경 없음" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### 자동 조립 완료" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- '*.html' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "build: 템플릿으로부터 HTML 자동 재생성 [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
